name: Deploy

# Manual only. Nothing deploys without an explicit dispatch, and each deploy job runs in the
# GitHub environment named by the chosen target, where the owner configures required
# reviewers and the allowed deployment branch (see docs/runbooks/infrastructure.md).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      deploy_backend:
        description: 'Deploy backend to Google Cloud Run'
        required: true
        default: true
        type: boolean
      deploy_frontend:
        description: 'Deploy frontend to Cloudflare Workers'
        required: true
        default: true
        type: boolean

# Least privilege by default. Only the backend deployment job below adds id-token: write,
# because only it exchanges a GitHub OIDC token with Google Cloud.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize target and branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fail closed before any validation or credential is used: dev deploys only from
      # develop and prod only from main. The cloud identity enforces the same pairing.
      - name: Require an allowed target and branch pairing
        env:
          TARGET: ${{ inputs.environment }}
          REF: ${{ github.ref }}
        run: |
          case "${TARGET}:${REF}" in
            dev:refs/heads/develop|prod:refs/heads/main)
              echo "Authorized: ${TARGET} from ${REF}"
              ;;
            *)
              echo "::error::Target '${TARGET}' may not be deployed from '${REF}'. dev deploys from refs/heads/develop and prod from refs/heads/main."
              exit 1
              ;;
          esac

      - name: Require at least one deployment target
        env:
          DEPLOY_BACKEND: ${{ inputs.deploy_backend }}
          DEPLOY_FRONTEND: ${{ inputs.deploy_frontend }}
        run: |
          if [ "${DEPLOY_BACKEND}" != "true" ] && [ "${DEPLOY_FRONTEND}" != "true" ]; then
            echo "::error::Select the backend, the frontend, or both."
            exit 1
          fi

  validate:
    name: Validate this exact commit
    needs: authorize
    # Runs the full CI workflow (unit, architecture, published-backend integration smoke,
    # format, frontend, infrastructure invariants) at the commit this run was dispatched on.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy-backend:
    name: Deploy Backend (GCP Cloud Run)
    needs: [authorize, validate]
    if: inputs.deploy_backend
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          REGION="${{ vars.GCP_REGION || 'us-central1' }}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # Releases are immutable, SHA-tagged images. No mutable tag is pushed, and Terraform
      # ignores the service image, so neither can reset the other.
      - name: Build and Push Backend Container Image
        id: image
        run: |
          REGION="${{ vars.GCP_REGION || 'us-central1' }}"
          PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
          REPO="${{ vars.GCP_ARTIFACT_REPO || 'portfolio' }}"
          IMAGE_TAG="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/backend:${{ github.sha }}"

          docker build -f backend/Dockerfile -t "${IMAGE_TAG}" .
          docker push "${IMAGE_TAG}"

          echo "reference=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.GCP_CLOUDRUN_SERVICE || 'rafael-portfolio-backend' }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          image: ${{ steps.image.outputs.reference }}

  deploy-frontend:
    name: Deploy Frontend (Cloudflare Workers)
    needs: [authorize, validate]
    if: inputs.deploy_frontend
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The build receives only public values. CLOUDFLARE_ENV selects the Wrangler
      # environment, which fixes the Worker name for this stage in the generated config.
      - name: Build Vinext bundle for the target stage
        working-directory: frontend
        run: npm run build:vinext
        env:
          CLOUDFLARE_ENV: ${{ inputs.environment }}
          PORTFOLIO_BACKEND_URL: ${{ vars.PORTFOLIO_BACKEND_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      # The Worker signs visitor identity with a secret that must equal the backend's. It is
      # set out of band on the exact Worker being deployed; this step only checks that a
      # secret with the right name exists (names are listed, values never are).
      - name: Require the proxy identity secret on the target Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER="$(node -p "require('./dist/server/wrangler.json').name")"
          echo "Target Worker: ${WORKER}"
          npx wrangler secret list --name "${WORKER}" --format json > "${RUNNER_TEMP}/worker-secrets.json"
          node -e '
            const names = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).map((s) => s.name);
            if (!names.includes("ASSISTANT_PROXY_IDENTITY_SECRET")) {
              console.error("::error::Worker " + process.argv[2] + " has no ASSISTANT_PROXY_IDENTITY_SECRET. Set it with wrangler secret put before deploying.");
              process.exit(1);
            }
          ' "${RUNNER_TEMP}/worker-secrets.json" "${WORKER}"

      # PORTFOLIO_BACKEND_URL is runtime configuration, read per request, so it is written
      # to the Worker here rather than baked into the bundle. Wrangler owns plaintext
      # variables and replaces any set elsewhere; secrets are never touched by a deploy.
      - name: Deploy to Cloudflare Workers via Wrangler
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.environment }}
          BACKEND_URL: ${{ vars.PORTFOLIO_BACKEND_URL }}
        run: |
          case "${BACKEND_URL}" in
            https://*) ;;
            *) echo "::error::PORTFOLIO_BACKEND_URL must be an https URL in the ${TARGET} environment."; exit 1 ;;
          esac
          npx wrangler deploy --env "${TARGET}" --var "PORTFOLIO_BACKEND_URL:${BACKEND_URL}"
