name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  # The deploy workflow calls this workflow so that the exact commit being deployed passes
  # the same validation, including the published-backend integration smoke.
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/Rafael.Portfolio.sln

      - name: Build solution (Release)
        run: dotnet build backend/Rafael.Portfolio.sln -c Release --no-restore

      - name: Run unit tests (Release)
        run: dotnet test backend/tests/Unit/Rafael.Portfolio.UnitTests/Rafael.Portfolio.UnitTests.csproj -c Release --no-build

      - name: Run architecture tests (Release)
        run: dotnet test backend/tests/Architecture/Rafael.Portfolio.ArchitectureTests/Rafael.Portfolio.ArchitectureTests.csproj -c Release --no-build

      - name: Run published-backend integration smoke (Release)
        run: dotnet test backend/tests/Integration/Rafael.Portfolio.IntegrationTests/Rafael.Portfolio.IntegrationTests.csproj -c Release --no-build

      - name: Check code formatting
        run: dotnet format backend/Rafael.Portfolio.sln --verify-no-changes --no-restore

  control-ledger:
    name: Control ledger (Firestore emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The transactional tests run only against a local emulator on a throwaway project id: no
      # Google Cloud project, credential or network service is involved. Without the emulator
      # every test fails as INCOMPLETE, so this job can never pass by skipping.
      - name: Start the Firestore emulator
        run: |
          docker run -d --name firestore-emulator -p 8080:8080 \
            google/cloud-sdk:emulators@sha256:3797a874fae6b75aa25260b5bd40fa0397c2f1102f18ae3ac7dc887732fbe449 \
            gcloud emulators firestore start --host-port=0.0.0.0:8080
          for attempt in $(seq 1 60); do
            docker logs firestore-emulator 2>&1 | grep -q "Dev App Server is now running" && break
            sleep 2
          done
          docker logs firestore-emulator 2>&1 | grep -q "Dev App Server is now running"

      - name: Restore dependencies
        run: dotnet restore backend/tests/Emulator/Rafael.Portfolio.EmulatorTests/Rafael.Portfolio.EmulatorTests.csproj

      - name: Run emulator-backed ledger tests (Release)
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: dotnet test backend/tests/Emulator/Rafael.Portfolio.EmulatorTests/Rafael.Portfolio.EmulatorTests.csproj -c Release --no-restore

  frontend:
    name: Frontend (Next.js & Vinext)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        working-directory: frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build Next.js production bundle
        working-directory: frontend
        run: npm run build

      - name: Build Vinext Cloudflare Workers bundle
        working-directory: frontend
        run: npm run build:vinext

      # Each stage is built with its own Wrangler environment and checked offline: the
      # generated Worker name, target environment, and bindings must match what Terraform
      # routes to and what the deploy workflow publishes. Nothing is uploaded.
      - name: Verify per-stage Worker build and Wrangler dry run
        working-directory: frontend
        run: |
          for stage in dev prod; do
            CLOUDFLARE_ENV="${stage}" npm run build:vinext
            node ../tools/check-wrangler-build.mjs "${stage}"
            npx wrangler deploy --dry-run --env "${stage}" \
              --outdir "${RUNNER_TEMP}/wrangler-${stage}" \
              --var PORTFOLIO_BACKEND_URL:https://backend.example.test
          done

  infrastructure:
    name: Infrastructure (Terraform and deployment invariants)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
          # The plan proofs parse `terraform show -json`; keep the real binary on PATH.
          terraform_wrapper: false

      - name: Check deployment invariants
        run: |
          node --test tools/check-deployment.test.mjs tools/check-wrangler-build.test.mjs
          node tools/check-deployment.mjs

      # Declared-file wiring, evidence against the canonical schema, Terraform scaling wiring,
      # the tracked-file address scan, and the release runbook's cost and privacy claims.
      # deploy.yml calls this workflow at the deployed commit, so this gates deployment too.
      - name: Check release invariants
        run: |
          node --test tools/check-release.test.mjs
          node tools/check-release.mjs

      - name: Validate GCP definitions
        run: |
          terraform -chdir=deployment/gcp fmt -check
          terraform -chdir=deployment/gcp init -backend=false
          terraform -chdir=deployment/gcp validate

      - name: Validate Cloudflare definitions
        run: |
          terraform -chdir=deployment/cloudflare fmt -check
          terraform -chdir=deployment/cloudflare init -backend=false
          terraform -chdir=deployment/cloudflare validate

      - name: Validate control ledger definitions
        run: |
          terraform -chdir=deployment/control-ledger fmt -check
          terraform -chdir=deployment/control-ledger init -backend=false
          terraform -chdir=deployment/control-ledger validate

      # Offline `terraform plan` proofs with synthetic credentials and no provider network:
      # credentials never reach a saved plan, and losing the service-phase inputs fails closed.
      - name: Prove plan secrecy and the service transition
        run: node tools/check-terraform-plans.mjs

  skills:
    name: Agent Skills Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify skill synchronization
        shell: pwsh
        run: ./tools/sync-agent-skills.ps1 -Check
